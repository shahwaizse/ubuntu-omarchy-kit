# ubuntu-omarchy-kit — Omarchy-style Hyprland for Ubuntu (adapted from Omarchy v3.8.4)
# Defaults live in ~/.local/share/omarchy-lite — override them in the files below.

source = ~/.local/share/omarchy-lite/default/hypr/autostart.conf
source = ~/.local/share/omarchy-lite/default/hypr/envs.conf
source = ~/.local/share/omarchy-lite/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy-lite/default/hypr/input.conf
source = ~/.local/share/omarchy-lite/default/hypr/windows.conf
source = ~/.local/share/omarchy-lite/default/hypr/tiling.conf
source = ~/.local/share/omarchy-lite/default/hypr/utilities.conf
source = ~/.local/share/omarchy-lite/default/hypr/media.conf
source = ~/.local/share/omarchy-lite/default/hypr/clipboard.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Your own tweaks
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf
