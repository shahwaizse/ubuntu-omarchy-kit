# Application shortcuts — edit freely, this file is yours.
# Chromium/Electron apps only use GNOME Keyring when they see "GNOME" in XDG_CURRENT_DESKTOP,
# so launchers get Hyprland:GNOME while the session itself stays plain "Hyprland" (see AGENTS.md).
$terminal = ghostty --config-file=~/.local/share/omarchy-lite/default/ghostty.conf --config-file=~/.config/omarchy/current/theme/ghostty.conf
$browser = env XDG_CURRENT_DESKTOP=Hyprland:GNOME gtk-launch $(xdg-settings get default-web-browser)
$webapp = env XDG_CURRENT_DESKTOP=Hyprland:GNOME google-chrome --app

bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER SHIFT, RETURN, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT, F, File manager, exec, nautilus --new-window
bindd = SUPER SHIFT, T, Activity, exec, $terminal -e btop

# Web apps (need Google Chrome) — uncomment or add your own:
# bindd = SUPER SHIFT, Y, YouTube, exec, $webapp=https://youtube.com
# bindd = SUPER SHIFT, E, Email, exec, $webapp=https://mail.google.com
# Editor, if you have VS Code:
# bindd = SUPER SHIFT, N, Editor, exec, code
