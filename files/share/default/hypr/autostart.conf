exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = /usr/libexec/hyprpolkitagent
exec-once = hypridle
exec-once = mako -c ~/.config/omarchy/current/theme/mako.ini
exec-once = waybar
exec-once = swayosd-server
exec-once = swaybg -i ~/.config/omarchy/current/background -m fill
exec-once = ~/.local/share/omarchy-lite/bin/omarchy-lite-wake
