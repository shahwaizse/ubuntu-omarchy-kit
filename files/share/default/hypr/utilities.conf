# Menus
bindd = SUPER, SPACE, Launch apps, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-menu launcher
bindd = SUPER, ESCAPE, System menu, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-menu power
bindld = , XF86PowerOff, Power menu, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-menu power
bindd = SUPER, K, Show key bindings, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-menu keys
bindd = SUPER SHIFT CTRL, SPACE, Theme menu, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-pick theme
bindd = SUPER CTRL, SPACE, Wallpaper picker, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-pick wallpaper
bindd = SUPER ALT, SPACE, Next theme wallpaper, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-bg-next
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, pkill -x waybar || waybar
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle do-not-disturb, exec, makoctl mode -t do-not-disturb
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Capture
bindd = , PRINT, Screenshot region, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-screenshot region
bindd = SHIFT, PRINT, Screenshot screen, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-screenshot screen
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Info & controls
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send -u low "$(date +"%A %H:%M  ·  %d %B %Y  ·  Week %V")"
bindd = SUPER CTRL, A, Audio controls, exec, pavucontrol
bindd = SUPER CTRL, B, Bluetooth controls, exec, blueman-manager
bindd = SUPER CTRL, W, Wifi controls, exec, env XDG_CURRENT_DESKTOP=GNOME gnome-control-center wifi
bindd = SUPER CTRL, T, Activity, exec, ghostty --class=org.omarchy.btop --config-file=~/.local/share/omarchy-lite/default/ghostty.conf --config-file=~/.config/omarchy/current/theme/ghostty.conf -e btop

# Zoom & lock
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1
bindd = SUPER CTRL, L, Lock system, exec, hyprlock
