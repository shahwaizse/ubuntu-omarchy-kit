bindeld = ,XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower
bindeld = ,XF86AudioMute, Mute, exec, swayosd-client --output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, swayosd-client --input-volume mute-toggle
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, swayosd-client --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, swayosd-client --output-volume -1
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-brightness +5
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-brightness -5
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-brightness +1
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-brightness -1
bindld = , XF86AudioNext, Next track, exec, swayosd-client --playerctl next
bindld = , XF86AudioPause, Pause, exec, swayosd-client --playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, swayosd-client --playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, swayosd-client --playerctl prev
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-brightness 100
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, ~/.local/share/omarchy-lite/bin/omarchy-lite-brightness 1
